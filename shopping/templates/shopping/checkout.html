{% extends "shopping/navbar.html" %}
{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold mb-6">Finaliser votre commande</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <!-- Résumé du panier -->
        <div class="md:col-span-2">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4">Articles dans votre panier</h2>
                <div id="commande-articles">
                    <!-- Sera rempli par JavaScript -->
                </div>
            </div>
        </div>
        
        <!-- Formulaire de commande -->
        <div class="md:col-span-1">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4">Informations de livraison</h2>
                <form method="post" action="{% url 'process_checkout' %}" id="form-commande" class="space-y-4">
                    {% csrf_token %}
                    
                    <div>
                        <label for="nom" class="block text-sm font-medium text-gray-700">Nom</label>
                        <input type="text" id="nom" name="nom" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                        <input type="email" id="email" name="email" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    
                    <div>
                        <label for="adresse" class="block text-sm font-medium text-gray-700">Adresse</label>
                        <textarea id="adresse" name="adresse" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"></textarea>
                    </div>
                    
                    <div>
                        <label for="telephone" class="block text-sm font-medium text-gray-700">Téléphone</label>
                        <input type="tel" id="telephone" name="telephone" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    
                    <!-- Champ caché pour stocker les articles du panier -->
                    <input type="hidden" id="panier_data" name="panier_data" value="">
                    
                    <div class="pt-4">
                        <h3 class="font-medium text-lg mb-2">Total: <span id="commande-total">0.00</span> FCFA</h3>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md">
                            Confirmer la commande
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    
        $(function() {
            // Récupérer le panier du localStorage
            var panier = [];
            if (localStorage.getItem('panier')) {
                panier = JSON.parse(localStorage.getItem('panier'));
            }
            
            // Mettre à jour le champ caché avec les données du panier
            $('#panier_data').val(JSON.stringify(panier));
            
            // Afficher les articles du panier
            var $commandeArticles = $('#commande-articles');
            var totalPrice = 0;
            
            if (panier.length === 0) {
                $commandeArticles.html('<p class="text-center py-4">Votre panier est vide</p>');
                $('#form-commande button[type="submit"]').prop('disabled', true).addClass('opacity-50 cursor-not-allowed');
            } else {
                var articlesHtml = '<div class="space-y-4">';
                
                $.each(panier, function(index, item) {
                    var itemTotal = item.price * item.quantity;
                    totalPrice += itemTotal;
                    
                    articlesHtml += '<div class="flex justify-between items-center border-b pb-4">' +
                        '<div>' +
                            '<h3 class="font-medium">' + item.name + '</h3>' +
                            '<p class="text-sm text-gray-500">Quantité: ' + item.quantity + ' × ' + parseFloat(item.price).toFixed(2) + ' FCFA</p>' +
                        '</div>' +
                        '<div class="font-medium">' + itemTotal.toFixed(2) + ' FCFA</div>' +
                    '</div>';
                });
                
                articlesHtml += '<div class="flex justify-between items-center pt-2 font-bold">' +
                    '<span>Total</span>' +
                    '<span>' + totalPrice.toFixed(2) + ' FCFA</span>' +
                '</div>';
                
                articlesHtml += '</div>';
                $commandeArticles.html(articlesHtml);
                $('#commande-total').text(totalPrice.toFixed(2));
            }
            
            // Assurer que le formulaire envoie les données correctement
            $('#form-commande').on('submit', function(e) {
                // Actualiser les données du panier juste avant l'envoi
                $('#panier_data').val(JSON.stringify(panier));
                
                // Vérifier si le panier est vide
                if (panier.length === 0) {
                    e.preventDefault();
                    alert("Votre panier est vide. Veuillez ajouter des articles avant de confirmer la commande.");
                    return false;
                }
                
                // Vider le panier après soumission réussie
                localStorage.removeItem('panier');
            });
            
            // Vérifier s'il y a des messages d'erreur du serveur
            {% if messages %}
                {% for message in messages %}
                    alert("{{ message }}");
                {% endfor %}
            {% endif %}
        });
        
</script>
{% endblock %}
