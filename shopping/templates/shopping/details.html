{% extends "shopping/navbar.html" %}
    
{% block content %}
<div class="bg-white min-h-screen">
    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- Product Section -->
        <div class="flex flex-col md:flex-row gap-6">
            <!-- Left Column - Product Image -->
            <div class="md:w-2/5">
                <div class="border border-gray-200 rounded overflow-hidden">
                    <img src="{{product.image_url}}" alt="name" 
                         class="w-full h-auto object-contain">
                </div>
            </div>
            
            <!-- Right Column - Product Info -->
            <div class="md:w-3/5">
                <h1 class="text-xl font-medium text-gray-900 mb-1">{{product.name}}</h1>
                
                <div class="mb-4 border-b border-gray-200 pb-4">
                    <span class="text-sm text-gray-500">{{product.description}}</span>
                </div>
                
                <div class="mb-2">
                    <span class="text-xl font-medium text-gray-900">{{product.price}} FCFA</span>
                </div>
                
                <div class="mb-6">
                    <div class="flex items-center text-sm text-green-600 mb-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        <span>En stock</span>
                    </div>
                    <div class="text-sm text-gray-700">Livraison disponible</div>
                </div>
                
                <!-- Add to Cart Section -->
                <div class="border border-gray-200 rounded-lg p-4 bg-gray-50 mb-4">
                    <div class="mb-3">
                        <label for="quantity" class="block text-sm font-medium text-gray-700 mb-1">Quantité</label>
                        <select id="quantity" class="border border-gray-300 rounded-md py-1 px-2 w-16 focus:ring-indigo-500 focus:border-indigo-500">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                        </select>
                    </div>
                    
                    <button class="w-full bg-yellow-400 hover:bg-yellow-500 text-sm py-2 px-4 rounded-full font-medium focus:outline-none focus:ring-2 focus:ring-yellow-300 mb-2">
                        Ajouter au panier
                    </button>
                    
                    <button class="w-full bg-orange-400 hover:bg-orange-500 text-sm py-2 px-4 rounded-full font-medium focus:outline-none focus:ring-2 focus:ring-orange-300">
                        Acheter maintenant
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
